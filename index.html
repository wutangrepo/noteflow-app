<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteFlow - Team Standup</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HEADER -->
    <header class="main-header">
        <div class="logo">
            <span class="icon">📝</span> NoteFlow
        </div>
        <div class="user-status">v1.1 (Categories Added)</div>
    </header>

    <main class="container">
        <!-- INPUT SECTION -->
        <section class="input-section">
            <h2>Daily Standup Update</h2>
            
            <div class="input-card">
                <!-- 1. Name Input -->
                <input type="text" id="nameInput" placeholder="Your Name (e.g. Alex)" class="input-field">
                
                <!-- 2. Category Dropdown (New Feature) -->
                <select id="categoryInput" class="input-field">
                    <option value="progress">🔵 In Progress</option>
                    <option value="done">🟢 Completed</option>
                    <option value="blocker">🔴 Blocker</option>
                </select>
                
                <!-- 3. Note Input -->
                <textarea id="noteInput" placeholder="What is the update?..." rows="3" class="input-field"></textarea>
                
                <!-- 4. Post Button -->
                <button id="addBtn" class="primary-btn">Post Note +</button>
            </div>
        </section>

        <!-- NOTES GRID -->
        <section class="notes-grid" id="notesContainer">
            <!-- Notes will appear here via JavaScript -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
